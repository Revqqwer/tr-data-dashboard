<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Portföy Torbası — 3N Finans</title>
<link rel="icon" href="/static/icons/icon-192.png">
<style>
  :root{--bg:#0a1120;--panel:#101c31;--panel2:#0d1728;--border:#22324b;--text:#eaf1fd;--muted:#8ea3c4;
    --accent:#f0b429;--good:#22c55e;--bad:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(1200px 700px at 50% -8%,#182a49 0%,var(--bg) 58%);color:var(--text);-webkit-font-smoothing:antialiased}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border)}
  .brand{font-weight:800;display:flex;align-items:center;gap:10px}
  .brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#a855f7);
    display:flex;align-items:center;justify-content:center;font-size:13px;color:#14100a}
  .tools{display:flex;gap:8px;flex-wrap:wrap}
  .sbtn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:10px;padding:8px 12px;
    font-size:13px;cursor:pointer}
  .sbtn:hover{color:var(--text);border-color:#33465f}
  .sbtn.danger:hover{color:#fca5a5;border-color:#7f1d1d}
  .wrap{max-width:1300px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px}
  @media(max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}}
  .stage{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:640px;
    background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:22px;overflow:hidden}
  .count{font-size:15px;color:var(--muted);margin-bottom:6px}
  .count b{font-size:34px;color:var(--accent);display:block;text-align:center;line-height:1.1}
  .bagbox{position:relative;width:340px;height:380px}
  .bag{width:100%;height:100%;transform-origin:50% 90%}
  .bag.shake{animation:shake .9s ease-in-out}
  @keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-7deg)}30%{transform:rotate(6deg)}45%{transform:rotate(-5deg)}
    60%{transform:rotate(4deg)}75%{transform:rotate(-2deg)}}
  .slip{position:absolute;left:50%;top:120px;width:120px;height:80px;margin-left:-60px;border-radius:8px;
    background:linear-gradient(180deg,#fff8e1,#f3e2b3);box-shadow:0 6px 18px rgba(0,0,0,.35);opacity:0;z-index:1;
    display:flex;align-items:center;justify-content:center;font-weight:900;color:#8a5a00;font-size:28px}
  .slip.rise{animation:rise 1.1s cubic-bezier(.2,.8,.25,1) forwards}
  @keyframes rise{0%{opacity:0;transform:translateY(40px) scale(.6) rotate(-8deg)}
    30%{opacity:1}100%{opacity:1;transform:translateY(-170px) scale(1.15) rotate(4deg)}}
  .drawbtn{margin-top:14px;border:0;cursor:pointer;border-radius:16px;font-weight:900;font-size:20px;padding:16px 38px;
    background:linear-gradient(135deg,#ffd76a,var(--accent));color:#211603;box-shadow:0 10px 30px rgba(240,180,41,.25);transition:filter .15s}
  .drawbtn:hover{filter:brightness(1.06)} .drawbtn:disabled{opacity:.45;cursor:not-allowed}
  .empty{color:var(--muted);margin-top:10px;font-size:14px}
  /* Açılan sonuç kartı */
  .reveal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;
    background:rgba(5,10,20,.72);backdrop-filter:blur(3px);z-index:5}
  .reveal.on{display:flex}
  .rcard{width:min(860px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,#fff9e8,#f5e6bd);color:#2a1d05;
    border-radius:20px;padding:22px 24px;box-shadow:0 30px 80px rgba(0,0,0,.5);animation:pop .55s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{0%{transform:scale(.4) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
  .rcard .who{font-size:13px;font-weight:800;letter-spacing:1px;color:#8a5a00;text-transform:uppercase}
  .rcard h2{margin:2px 0 14px;font-size:30px}
  .rcard img{max-width:100%;max-height:60vh;display:block;margin:0 auto 14px;border-radius:12px;border:1px solid #e3cf98}
  .rcard pre{white-space:pre-wrap;font-family:inherit;font-size:19px;line-height:1.55;margin:0;background:rgba(255,255,255,.55);
    border-radius:12px;padding:14px 16px}
  .rcard .close{margin-top:16px;border:0;background:#2a1d05;color:#fff;border-radius:12px;padding:11px 20px;font-weight:800;cursor:pointer}
  /* Çekilenler */
  .side{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:22px;padding:18px;
    max-height:640px;overflow:auto}
  .side h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted)}
  .item{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer}
  .item:hover{border-color:#33465f}
  .item .th{width:52px;height:52px;border-radius:8px;background:#0b1424;flex:none;overflow:hidden;display:flex;align-items:center;
    justify-content:center;font-size:22px}
  .item .th img{width:100%;height:100%;object-fit:cover}
  .item .t{flex:1;min-width:0}
  .item .n{font-weight:800}
  .item .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:4px}
  .item .x:hover{color:#fca5a5}
  .share{font-size:12.5px;color:var(--muted);margin-top:4px}
  .share a{color:var(--accent)}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><span class="logo">3N</span> Portföy Torbası</div>
  <div class="tools">
    <button class="sbtn" id="reset" title="Çekilenleri torbaya geri koy">↺ Torbayı yeniden doldur</button>
    <button class="sbtn danger" id="clear" title="Tüm gönderimleri sil">🗑 Hepsini sil</button>
  </div>
</div>
<div class="wrap">
  <div class="stage">
    <div class="count">Torbada<b id="n">–</b>portföy</div>
    <div class="bagbox">
      <div class="slip" id="slip">?</div>
      <svg class="bag" id="bag" viewBox="0 0 340 380" aria-hidden="true">
        <defs>
          <linearGradient id="sack" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9a063"/><stop offset="1" stop-color="#8a6435"/></linearGradient>
          <linearGradient id="sack2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b48a51"/><stop offset="1" stop-color="#7b5830"/></linearGradient>
        </defs>
        <ellipse cx="170" cy="362" rx="120" ry="12" fill="rgba(0,0,0,.35)"/>
        <!-- gövde -->
        <path d="M118 128 C70 170 46 230 52 290 C58 345 110 360 170 360 C230 360 282 345 288 290 C294 230 270 170 222 128 Z" fill="url(#sack)"/>
        <!-- doku çizgileri -->
        <g stroke="rgba(80,50,15,.25)" stroke-width="2" fill="none">
          <path d="M90 200 C140 215 200 215 250 200"/><path d="M70 255 C140 275 200 275 270 255"/><path d="M70 310 C140 328 200 328 270 310"/>
        </g>
        <!-- boyun ve ağız -->
        <path d="M128 92 C140 112 200 112 212 92 L222 128 C200 140 140 140 118 128 Z" fill="url(#sack2)"/>
        <ellipse cx="170" cy="92" rx="44" ry="13" fill="#3b2a14"/>
        <!-- ip -->
        <path d="M118 124 C150 138 190 138 222 124" stroke="#e8d3a0" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M206 130 C226 150 236 162 246 178" stroke="#e8d3a0" stroke-width="5" fill="none" stroke-linecap="round"/>
        <!-- 3N etiketi -->
        <circle cx="170" cy="248" r="40" fill="#0f1420" stroke="#f0b429" stroke-width="4"/>
        <text x="170" y="262" text-anchor="middle" font-size="36" font-weight="900" fill="#f0b429" font-family="Arial,sans-serif">3N</text>
      </svg>
    </div>
    <button class="drawbtn" id="draw">🎲 Torbadan Çek</button>
    <div class="empty" id="empty" style="display:none">Torba boş — izleyiciler <b>3nfinans.com/portfoy-paylas</b> adresinden portföy gönderebilir.</div>
    <div class="share">Gönderim sayfası: <a href="/portfoy-paylas" target="_blank">www.3nfinans.com/portfoy-paylas</a></div>

    <div class="reveal" id="reveal">
      <div class="rcard" id="rcard"></div>
    </div>
  </div>

  <div class="side">
    <h3>Çekilenler (<span id="dn">0</span>)</h3>
    <div id="drawn"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let busy=false, drawnList=[];
async function api(path,opts){const r=await fetch(path,Object.assign({credentials:'same-origin'},opts||{}));return r.json()}
async function load(){
  const s=await api('/api/torba/state');
  $('n').textContent=s.in_bag; drawnList=s.drawn||[]; renderDrawn();
  $('draw').disabled=s.in_bag===0; $('empty').style.display=s.in_bag===0?'block':'none';
}
function renderDrawn(){
  $('dn').textContent=drawnList.length;
  $('drawn').innerHTML=drawnList.map(d=>`<div class="item" data-id="${d.id}">
    <div class="th">${d.image?`<img src="/torba/img/${d.id}" loading="lazy" alt="">`:'📝'}</div>
    <div class="t"><div class="n">${esc(d.nick)}</div><div class="s">${esc(d.text||'Ekran görüntüsü')}</div></div>
    <button class="x" data-del="${d.id}" title="Sil">✕</button></div>`).join('')||'<div class="s" style="color:var(--muted)">Henüz çekiliş yok.</div>';
}
$('drawn').onclick=async ev=>{
  const del=ev.target.closest('[data-del]');
  if(del){ev.stopPropagation();if(!confirm('Bu gönderim silinsin mi?'))return;await api('/api/torba/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:+del.dataset.del})});return load()}
  const it=ev.target.closest('.item'); if(!it)return;
  const d=drawnList.find(x=>x.id==it.dataset.id); if(d) show(d);
};
function show(d){
  $('rcard').innerHTML=`<div class="who">Torbadan çıkan portföy</div><h2>${esc(d.nick)}</h2>
    ${d.image?`<img src="/torba/img/${d.id}" alt="Portföy ekran görüntüsü">`:''}
    ${d.text?`<pre>${esc(d.text)}</pre>`:''}
    <button class="close" onclick="document.getElementById('reveal').classList.remove('on')">Kapat</button>`;
  $('reveal').classList.add('on');
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
$('draw').onclick=async()=>{
  if(busy)return; busy=true; $('draw').disabled=true;
  const bag=$('bag'), slip=$('slip');
  bag.classList.remove('shake'); void bag.offsetWidth; bag.classList.add('shake');
  const res=api('/api/torba/draw',{method:'POST'});
  await sleep(900);
  slip.classList.remove('rise'); void slip.offsetWidth; slip.classList.add('rise');
  const j=await res; await sleep(1150);
  slip.classList.remove('rise');
  if(j.ok){ $('n').textContent=j.in_bag; drawnList.unshift(j.item); renderDrawn(); show(j.item) }
  else alert(j.error||'Çekiliş yapılamadı');
  busy=false; $('draw').disabled=(j.in_bag===0); $('empty').style.display=j.in_bag===0?'block':'none';
};
$('reset').onclick=async()=>{if(!confirm('Çekilen tüm portföyler torbaya geri konsun mu?'))return;await api('/api/torba/reset',{method:'POST'});load()};
$('clear').onclick=async()=>{if(!confirm('TÜM gönderimler (görseller dahil) kalıcı olarak silinsin mi?'))return;await api('/api/torba/clear',{method:'POST'});load()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('reveal').classList.remove('on')});
load(); setInterval(()=>{if(!busy&&!$('reveal').classList.contains('on'))api('/api/torba/state').then(s=>{$('n').textContent=s.in_bag;$('draw').disabled=s.in_bag===0;$('empty').style.display=s.in_bag===0?'block':'none'})},15000);
</script>
</body>
</html>
