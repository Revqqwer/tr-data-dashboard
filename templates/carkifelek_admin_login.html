<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Çarkıfelek Yönetici Girişi — 3N Finans</title>
<link rel="icon" href="/static/icons/icon-192.png">
<style>
  :root{
    --bg:#0a1120; --panel:#101c31; --panel2:#0d1728; --border:#22324b;
    --text:#eaf1fd; --muted:#8ea3c4; --accent:#f0b429; --accent-d:#d8890a; --bad:#ef4444;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:radial-gradient(1200px 700px at 50% -8%,#182a49 0%,var(--bg) 58%);
    color:var(--text); -webkit-font-smoothing:antialiased; padding:20px;
  }
  .card{width:100%;max-width:380px;background:linear-gradient(180deg,var(--panel),var(--panel2));
    border:1px solid var(--border);border-radius:18px;padding:28px 26px}
  .logo{width:44px;height:44px;border-radius:12px;margin:0 auto 14px;
    background:linear-gradient(135deg,var(--accent),#a855f7);display:flex;align-items:center;justify-content:center;font-size:22px}
  h1{font-size:18px;text-align:center;margin:0 0 4px;letter-spacing:-.3px}
  p{color:var(--muted);font-size:13px;text-align:center;margin:0 0 22px}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;text-transform:uppercase;letter-spacing:.6px}
  input{width:100%;background:#0b1424;border:1px solid var(--border);color:var(--text);
    padding:12px 14px;border-radius:12px;font-size:15px;margin-bottom:16px}
  input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(240,180,41,.15)}
  .btn{width:100%;border:none;cursor:pointer;border-radius:12px;font-weight:800;font-size:14px;padding:13px;
    background:linear-gradient(135deg,#ffd76a,var(--accent) 45%,var(--accent-d));color:#211603;
    box-shadow:0 6px 18px rgba(240,180,41,.28)}
  .err{color:var(--bad);font-size:13px;text-align:center;margin:-8px 0 16px}
  .back{display:block;text-align:center;margin-top:18px;font-size:12.5px;color:var(--muted);text-decoration:none}
  .back:hover{color:var(--text)}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">🎡</div>
    <h1>Çarkıfelek Yönetici Girişi</h1>
    <p>Çarkta çıkan hisseyi otomatik havuzdan çıkarmak için giriş yap.</p>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    <form method="post">
      <label for="id">ID</label>
      <input id="id" name="id" autocomplete="off" autofocus>
      <label for="password">Şifre</label>
      <input id="password" name="password" type="password" autocomplete="off">
      <button class="btn" type="submit">Giriş Yap</button>
    </form>
    <a class="back" href="/carkifelek">← Çarkıfelek'e dön</a>
  </div>
</body>
</html>
